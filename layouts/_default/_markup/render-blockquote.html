{{- /* 引文：
       `> [!NOTE] ...` → 註記框，左上角印類型
       `> ...`         → 人聲引文（楷體 + 左側線，cage-voice） */ -}}
{{- if eq .Type "alert" -}}
<aside class="md-alert" data-alert="{{ .AlertType }}">
  <div class="md-alert__type">{{ .AlertType | upper }}</div>
  {{ .Text }}
</aside>
{{- else -}}
<blockquote class="md-quote">{{ .Text }}</blockquote>
{{- end -}}
