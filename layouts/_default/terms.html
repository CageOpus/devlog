{{- /* /tags/ 這類 taxonomy 總表。 */ -}}
{{- define "main" }}
<div class="page">
  {{- partial "status-backdrop.html" . }}
  <div class="page__main">
    <div class="section-head">
      <span class="section-head__label">{{ T .Data.Plural | default .Title }}</span>
      <span class="section-head__rule"></span>
      <span class="section-head__note">{{ T "tagCount" (len .Data.Terms) }}</span>
    </div>
    <div class="terms-list cage-well">
      {{- partial "tag-index.html" . }}
    </div>
  </div>
  {{- partial "side-rail.html" . }}
</div>
{{- end }}
