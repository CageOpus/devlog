baseURL = 'http://localhost:1313/'
title = 'CAGE — Devlog'
theme = "cage"
defaultContentLanguage = 'en'
# 中文沒有空白分詞，要開這個字數與閱讀時間才會一字一字算
hasCJKLanguage = true

[params]
  author = "Ray Chung"
  authorRole = "SOLO DEV · TAIPEI"
  build = "0.0.1"
  stack = "RUST + WGPU"
  disableThemeToggle = false
  mainSections = ["posts"]

  # 頁首標準字組
  [params.brand]
    title = "City Architect"
    subtitle = "Golden Era"

[markup.goldmark.renderer]
  unsafe = true

# 讓獨立成段的圖片交給 render-image 的 block 分支（輸出 figure 而不是包在 <p> 裡）
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.goldmark.extensions.cjk]
  enable = true
  eastAsianLineBreaks = true
  eastAsianLineBreaksStyle = "css3draft"

[markup.highlight]
  noClasses = false
  lineNos = false
  codeFences = true
  guessSyntax = true

# ── 語言 ──
# 英文是預設語言，放在根目錄；中文放在 /zh-tw/（Hugo 的語言目錄一律小寫）。
# 文章的譯本用檔名區分：post.md 是英文、post.zh-tw.md 是中文，同名的兩個檔自動配成一組。
# 只有一種語言的文章，另一個語言的列表照樣列出原文（見 layouts/partials/post-pages.html）。
# 介面字串在 i18n/，儀表式的英文標籤（READ、BUILD、FIG……）屬於機殼的一部分，不翻。
# 預設語言 defaultContentLanguage 寫在檔案最上面（TOML 的頂層 key 必須在所有表格之前）。

[languages.en]
  weight = 1
  locale = 'en-US'
  label = 'English'

  # 閱讀速度（每分鐘字數），用來估閱讀時間（見 layouts/partials/reading-time.html）。
  # 技術文章，比一般非小說的每分鐘 240 字慢一些
  [languages.en.params]
    readingSpeed = 200

  [[languages.en.menus.main]]
    identifier = "posts"
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[languages.en.menus.main]]
    identifier = "about"
    name = "About"
    pageRef = "/about"
    weight = 20

[languages.zh-tw]
  weight = 2
  locale = 'zh-TW'
  label = '中文'

  # 可以直排的文字：橫屏 rail 的導覽鍵上豎排列，而不是整個字轉 90°
  [languages.zh-tw.params]
    verticalWriting = true
    # 每分鐘字數：一般中文閱讀約 250 字，夾在中間的英文術語與程式碼一個單字只算一字，所以調高一點
    readingSpeed = 300

  [[languages.zh-tw.menus.main]]
    identifier = "posts"
    name = "文章"
    pageRef = "/posts"
    weight = 10
  [[languages.zh-tw.menus.main]]
    identifier = "about"
    name = "關於"
    pageRef = "/about"
    weight = 20
