baseURL = 'http://localhost:1313/'
locale = 'en-us'
title = 'CAGE — Devlog'
theme = "cage"

[params]
  author = "Ray Chung"
  authorRole = "SOLO DEV · TAIPEI"
  build = "0.0.1"
  stack = "RUST + WGPU"
  disableThemeToggle = false
  mainSections = ["posts"]

  # 頁首標準字組
  [params.brand]
    title = "City Architect"
    subtitle = "Golden Era"

[markup.goldmark.renderer]
  unsafe = true

# 讓獨立成段的圖片交給 render-image 的 block 分支（輸出 figure 而不是包在 <p> 裡）
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.goldmark.extensions.cjk]
  enable = true
  eastAsianLineBreaks = true
  eastAsianLineBreaksStyle = "css3draft"

[markup.highlight]
  noClasses = false
  lineNos = false
  codeFences = true
  guessSyntax = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    pageRef = "/posts"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "關於"
    pageRef = "/about"
    weight = 20
